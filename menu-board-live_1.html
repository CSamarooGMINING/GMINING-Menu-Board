<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cafeteria Menu Board</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #ffd700;
    --gold-dim: rgba(255, 215, 0, 0.22);
    --bg: #1a1a2e;
    --bg-card: rgba(255,255,255,0.06);
    --border-card: rgba(255,255,255,0.11);
    --text: #f0f0f0;
    --text-dim: rgba(255,255,255,0.55);
    --text-hint: rgba(255,255,255,0.28);
    --divider: rgba(255,255,255,0.06);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 2rem 2.5rem 1.25rem;
  }

  /* ── Header ── */
  .hdr {
    text-align: center;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 1.5rem;
    flex-shrink: 0;
  }
  .hdr-title { font-size: clamp(1.8rem, 3.5vw, 2.8rem); font-weight: 700; color: var(--gold); letter-spacing: 1.5px; }
  .hdr-meta  { display: flex; justify-content: center; align-items: center; gap: 1.5rem; margin-top: 0.4rem; }
  .hdr-date  { font-size: clamp(0.85rem, 1.3vw, 1.05rem); color: var(--text-dim); }
  .hdr-clock { font-size: clamp(1rem, 1.6vw, 1.3rem); font-weight: 600; color: var(--gold); letter-spacing: 2px; }
  .hdr-dot   { color: var(--text-hint); }

  /* ── Menu grid ── */
  #menu-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 1.1rem;
    overflow: hidden;
    align-content: start;
  }

  .menu-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 14px;
    padding: 1rem 1.15rem;
  }
  .card-title {
    font-size: clamp(0.7rem, 1vw, 0.85rem);
    font-weight: 600;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    padding-bottom: 0.55rem;
    margin-bottom: 0.6rem;
    border-bottom: 1px solid var(--gold-dim);
  }
  .card-item {
    font-size: clamp(0.88rem, 1.25vw, 1.05rem);
    color: var(--text);
    padding: 0.28rem 0;
    border-bottom: 1px solid var(--divider);
    line-height: 1.4;
  }
  .card-item:last-child { border-bottom: none; }
  .card-item.empty { color: var(--text-hint); font-style: italic; }

  /* ── Footer ── */
  .ftr {
    text-align: center;
    margin-top: 1rem;
    font-size: clamp(0.65rem, 0.9vw, 0.8rem);
    color: var(--text-hint);
    flex-shrink: 0;
  }
  .ftr-status { margin-top: 4px; font-size: 0.7rem; color: var(--text-hint); }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4caf50; margin-right: 5px; vertical-align: middle; }
  .status-dot.err { background: #f44336; }
  .status-dot.loading { background: var(--gold); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── States ── */
  #loading-state, #error-state {
    display: none;
    flex: 1;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    text-align: center;
  }
  #loading-state.show, #error-state.show { display: flex; }
  #loading-state p { color: var(--text-dim); font-size: 1.1rem; }
  #error-state p   { color: #f44336; font-size: 1rem; max-width: 500px; line-height: 1.6; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,215,0,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">

  <div class="hdr">
    <div class="hdr-title">Camp Cafeteria</div>
    <div class="hdr-meta">
      <span class="hdr-date"  id="hdr-date"></span>
      <span class="hdr-dot">·</span>
      <span class="hdr-clock" id="hdr-clock"></span>
    </div>
  </div>

  <div id="loading-state" class="show">
    <div class="spinner"></div>
    <p>Loading today's menu…</p>
  </div>

  <div id="error-state">
    <p id="err-msg">Could not load the menu. Check the internet connection and refresh.</p>
  </div>

  <div id="menu-grid"></div>

  <div class="ftr">
    Ask a staff member for allergen or dietary information &nbsp;·&nbsp; Menu subject to change
    <div class="ftr-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </div>
  </div>

</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2uMCYSFjlpLiFekYnj2rfX7lsxYDzzS-a9tJ2pzv6q7er9ZrsC55kNUtErKGfQciswDia5SU46AgE/pub?output=csv';
const REFRESH_MS = 60 * 1000; // 1 minute

// Section icons keyed by lowercase name keywords
const ICONS = {
  main: '🍲', course: '🍲', soup: '🍜', side: '🥗', salad: '🥗',
  dessert: '🍮', sweet: '🍮', beverage: '☕', drink: '☕',
  special: '🌿', diet: '🌿', vegan: '🌿', snack: '🥪', breakfast: '🍳',
  lunch: '🍽️', dinner: '🍽️',
};

function iconFor(name) {
  const lower = name.toLowerCase();
  for (const [key, icon] of Object.entries(ICONS)) {
    if (lower.includes(key)) return icon + ' ';
  }
  return '🍽️ ';
}

// ── CSV parser (handles quoted fields) ─────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  const lines = text.trim().split('\n');
  for (const line of lines) {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

// ── Render menu ─────────────────────────────────────────────────────────────
function renderMenu(rows) {
  // Skip header row
  const data = rows.slice(1).filter(r => r[0] && r[0].trim());

  const grid = document.getElementById('menu-grid');
  grid.innerHTML = '';

  data.forEach(row => {
    const section = row[0] ? row[0].trim() : '';
    const raw     = row[1] ? row[1].trim() : '';
    const items   = raw ? raw.split(',').map(s => s.trim()).filter(Boolean) : [];

    const card = document.createElement('div');
    card.className = 'menu-card';
    card.innerHTML = `
      <div class="card-title">${iconFor(section)}${section}</div>
      ${items.length
        ? items.map(i => `<div class="card-item">${i}</div>`).join('')
        : `<div class="card-item empty">Not available today</div>`}
    `;
    grid.appendChild(card);
  });
}

// ── Fetch & refresh ─────────────────────────────────────────────────────────
let lastFetch = null;

async function fetchMenu() {
  const dot  = document.getElementById('status-dot');
  const txt  = document.getElementById('status-text');
  const load = document.getElementById('loading-state');
  const err  = document.getElementById('error-state');
  const grid = document.getElementById('menu-grid');

  dot.className = 'status-dot loading';
  txt.textContent = 'Refreshing…';

  try {
    // Cache-bust so the TV always gets fresh data
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const rows = parseCSV(text);

    if (rows.length < 2) throw new Error('Sheet appears empty');

    renderMenu(rows);

    load.classList.remove('show');
    err.classList.remove('show');
    grid.style.display = 'grid';

    lastFetch = new Date();
    dot.className = 'status-dot';
    txt.textContent = 'Updated ' + lastFetch.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  } catch (e) {
    dot.className = 'status-dot err';
    if (!lastFetch) {
      // First load failed — show error state
      load.classList.remove('show');
      err.classList.add('show');
      grid.style.display = 'none';
      document.getElementById('err-msg').textContent =
        'Could not load the menu. Make sure the Google Sheet is published and the TV has internet access. Will retry automatically.';
    }
    txt.textContent = 'Last updated ' + (lastFetch ? lastFetch.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'never') + ' · Retrying…';
  }
}

// ── Clock ───────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('hdr-clock').textContent = h + ':' + m;
  document.getElementById('hdr-date').textContent = now.toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}

// ── Init ─────────────────────────────────────────────────────────────────────
updateClock();
setInterval(updateClock, 1000);
fetchMenu();
setInterval(fetchMenu, REFRESH_MS);
</script>
</body>
</html>
